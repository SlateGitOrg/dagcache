[project]
name = "dagcache"
version = "0.1.0"
description = "Content-addressed, cached, parallel pipeline runner for reproducible ML workflows"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "archit2501" }]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["pyyaml>=6.0.3"]

[project.optional-dependencies]
s3 = ["boto3>=1.43.118"]

[project.scripts]
dagcache = "dagcache.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "boto3>=1.43.118",
    "boto3-stubs[s3]>=1.43.118",
    "hypothesis>=6.170.9",
    "moto[s3]>=5.2.4",
    "mypy>=2.4.0",
    "numpy>=2.5.4",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
    "scikit-learn>=1.9.1",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PT", "C4", "PIE", "RET"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "PLC0415",
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "PLW0603", "PT018"]
"tests/conftest.py" = ["E501"]  # YAML fixtures read better unwrapped
"examples/**" = ["T201"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src/dagcache"]

[[tool.mypy.overrides]]
module = ["moto.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration'"
pythonpath = ["tests"]
markers = [
    "integration: needs Docker (S3 server); run with `make integration`",
    "slow: end-to-end example runs",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["dagcache"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85
exclude_also = ["if TYPE_CHECKING:", "pragma: no cover", "raise NotImplementedError"]
